name: daily-news

on:
  schedule:
    # 04:00 UTC = 12:00 北京时间。GitHub 的 cron 在高峰期可能延迟几分钟到半小时。
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and push to WeChat
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: python scripts/daily_news.py --out brief.md

      - name: Upload brief as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-news
          path: brief.md
          if-no-files-found: ignore
          retention-days: 7
